<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e6f4ef">
  <title>Map Local Bình Thuận – Thoai Mai House</title>
  <meta name="description" content="Bản đồ du lịch địa phương Bình Thuận: chỗ ở, quán ăn, cà phê, điểm tham quan và lịch trình gợi ý.">
  <meta property="og:title" content="Map Local Bình Thuận">
  <meta property="og:description" content="Bản đồ du lịch địa phương do Thoai Mai House giới thiệu.">
  <meta property="og:image" content="/assets/stay-sea.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Mulish:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="map.css?v=1">
</head>
<body class="sheet-half">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></g></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></g></symbol>
    <symbol id="i-gmap" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 2a7.2 7.2 0 0 0-7.2 7.2c0 5.3 7.2 12.8 7.2 12.8s7.2-7.5 7.2-12.8A7.2 7.2 0 0 0 12 2zm0 9.8a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></g></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></g></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></g></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M5 12h14"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></g></symbol>
  </svg>

  <div id="map" aria-label="Bản đồ"></div>

  <header class="topbar">
    <a class="icon-btn" href="index.html" aria-label="Về trang chính"><svg><use href="#i-back"/></svg></a>
    <div class="brand">
      <span class="brand-kicker">Map Local</span>
      <strong id="brand-title">Bình Thuận</strong>
    </div>
    <a class="icon-btn admin-btn" href="admin.html" aria-label="Đăng nhập quản trị" title="Đăng nhập quản trị"><svg><use href="#i-user"/></svg></a>
    <button class="icon-btn" id="share-btn" type="button" aria-label="Chia sẻ trang này"><svg><use href="#i-share"/></svg></button>
    <div class="areas" id="areas" aria-label="Khu vực"></div>
  </header>

  <nav class="chips" id="chips" aria-label="Lọc theo danh mục"></nav>

  <div class="map-ctrl" aria-label="Điều khiển bản đồ">
    <button type="button" id="zoom-in" aria-label="Phóng to"><svg><use href="#i-plus"/></svg></button>
    <button type="button" id="zoom-out" aria-label="Thu nhỏ"><svg><use href="#i-minus"/></svg></button>
    <button type="button" id="fit-btn" aria-label="Xem tất cả điểm"><svg><use href="#i-fit"/></svg></button>
    <button type="button" id="locate-btn" aria-label="Vị trí của tôi"><svg><use href="#i-locate"/></svg></button>
    <button type="button" id="layer-btn" aria-label="Đổi kiểu bản đồ"><svg><use href="#i-layers"/></svg></button>
  </div>

  <aside class="sheet" id="sheet" aria-label="Thông tin địa điểm">
    <button class="handle" id="handle" type="button" aria-label="Kéo hoặc nhấn để mở rộng"><i></i></button>
    <div class="sheet-scroll" id="sheet-scroll">
      <div id="view"></div>
    </div>
  </aside>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" type="button" id="lb-close" aria-label="Đóng"><svg><use href="#i-close"/></svg></button>
    <button class="lb-nav prev" type="button" id="lb-prev" aria-label="Ảnh trước"><svg><use href="#i-back"/></svg></button>
    <img id="lb-img" alt="">
    <button class="lb-nav next" type="button" id="lb-next" aria-label="Ảnh sau"><svg><use href="#i-next"/></svg></button>
    <div class="lb-count" id="lb-count"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="map.js?v=1"></script>
</body>
</html>
